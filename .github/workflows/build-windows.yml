name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build IPHunter-Setup.exe
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name IPHunter
          gui.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\windows\IPHunter.iss"

      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path "installer-output/IPHunter-Setup.exe")) {
            throw "installer-output/IPHunter-Setup.exe was not created"
          }
          Get-Item "installer-output/IPHunter-Setup.exe" | Format-List Name, Length, LastWriteTime

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: IPHunter-Windows-Installer
          path: installer-output/IPHunter-Setup.exe
          if-no-files-found: error
          retention-days: 30
